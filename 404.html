<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — AL-QAIM CRICKET CLUB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', Arial, sans-serif;
      background: linear-gradient(135deg, #080c14 0%, #111b2e 100%);
      color: #e8f0fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .error-code {
      font-size: 8rem;
      font-weight: bold;
      background: linear-gradient(90deg, #00e5a0, #00c8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      line-height: 1;
    }
    h1 {
      font-size: 2rem;
      margin: 20px 0;
      color: #e8f0fe;
    }
    p {
      font-size: 1.1rem;
      color: #7a8fa8;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #00e5a0, #00c8ff);
      color: #080c14;
      text-decoration: none;
      border-radius: 100px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
      box-shadow: 0 0 24px rgba(0, 229, 160, 0.25);
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(0, 229, 160, 0.45);
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🏏</div>
    <p class="error-code">404</p>
    <h1>Page Not Found</h1>
    <p>
      The page you're looking for doesn't exist or has been moved. 
      Let's get you back on track!
    </p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
